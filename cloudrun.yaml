spec:
  template:
    metadata:
      labels:
        client.knative.dev/nonce: f6fbc5cb-f913-4b35-bf14-2c54af1b043b
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/maxScale: 1
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/client-name: cloud-console
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      serviceAccountName: 871965503155-compute@developer.gserviceaccount.com
      containers:
      - name: keycloak-1
        image: asia-southeast1-docker.pkg.dev/stellar-zoo-478023-v4/idp/keycloak@sha256:916af884331a946ab7aac2d5325ebd6bea6a003d5a2c629e841f59970f91357f
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://ep-solitary-bar-aodntij6-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&sslmode=require&channelBinding=require
        - name: KC_DB_USERNAME
          value: neondb_owner
        - name: KC_HOSTNAME
          value: auth.knobby.io
        - name: KC_HOSTNAME_STRICT
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: knobby-keycloak-db-password
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          # NOTE: prior to 2026-06-09 this entry's `name:` was
          # KC_BOOTSTRAP_ADMIN_PASSWORD= (with a trailing `=`). That made the env-
          # var name invalid and Cloud Run was likely silently dropping it. Fixed
          # during the MCP SPI rollout. Verify the bootstrap admin actually works
          # on the next deploy.
          valueFrom:
            secretKeyRef:
              key: latest
              name: knobby-keycloak-bootstrap-password
        # ---------------------------------------------------------------------
        # MCP SPI handoff HMAC keys (per realm). Uncomment and commit each entry
        # once the matching GCP Secret Manager secret exists. See
        # specs/keycloak-hmac-operations-guide.md §3 for the secret-creation
        # procedure.
        #
        # Per-realm: one Keycloak instance hosts knobby-prod, knobby-dev, and
        # (future) knobby-test. Each realm holds its OWN HMAC key for cross-realm
        # isolation. Until at least one of these is wired AND the realm's
        # `browser-mcp-tenant-pick` flow is configured per
        # specs/keycloak.prd.md §16.11, MCP login flows will fail with
        # `MISSING_HMAC_KEY` in the Keycloak logs.
        #
        # - name: KNOBBY_MCP_HANDOFF_HMAC_KEY__KNOBBY_PROD
        #   valueFrom:
        #     secretKeyRef:
        #       name: knobby-mcp-handoff-hmac-key-knobby-prod
        #       key: latest
        # - name: KNOBBY_MCP_HANDOFF_HMAC_KEY__KNOBBY_DEV
        #   valueFrom:
        #     secretKeyRef:
        #       name: knobby-mcp-handoff-hmac-key-knobby-dev
        #       key: latest
        # - name: KNOBBY_MCP_HANDOFF_HMAC_KEY__KNOBBY_TEST
        #   valueFrom:
        #     secretKeyRef:
        #       name: knobby-mcp-handoff-hmac-key-knobby-test
        #       key: latest
        #
        # During a rotation overlap, ALSO add the matching previous-slot entries:
        # - name: KNOBBY_MCP_HANDOFF_HMAC_KEY_PREVIOUS__KNOBBY_PROD
        #   valueFrom:
        #     secretKeyRef:
        #       name: knobby-mcp-handoff-hmac-key-knobby-prod-previous
        #       key: latest
        # ---------------------------------------------------------------------
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
  traffic:
  - percent: 100
    latestRevision: true
