apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: your-keycloak-service
  labels:
    cloud.googleapis.com/location: your-region
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      serviceAccountName: keycloak-runner@your-gcp-project-id.iam.gserviceaccount.com
      containers:
      - name: keycloak
        image: your-region-docker.pkg.dev/your-gcp-project-id/idp/keycloak:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: "jdbc:postgresql://your-postgres-host:5432/your-database?sslmode=require&prepareThreshold=0"
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_HOSTNAME
          value: auth.yourapp.com
        - name: KC_HOSTNAME_STRICT
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: KC_CACHE
          value: local
        - name: KC_DB_POOL_MAX_SIZE
          value: "8"
        - name: KC_DB_POOL_INITIAL_SIZE
          value: "2"
        - name: KC_DB_POOL_MIN_SIZE
          value: "2"
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: latest
              name: yourapp-keycloak-db-password-prod
        - name: YOURAPP_MCP_HANDOFF_HMAC_KEY__YOURAPP_PROD
          valueFrom:
            secretKeyRef:
              key: latest
              name: yourapp-mcp-handoff-hmac-key-prod
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          initialDelaySeconds: 30
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 5
          httpGet:
            path: /health/ready
            port: 9000
  traffic:
  - percent: 100
    latestRevision: true
