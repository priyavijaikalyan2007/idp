name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Build SPI
        working-directory: src/providers
        run: mvn -B -ntp -DskipTests package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # SARIF upload (code scanning) requires GitHub Advanced Security, which
          # is not enabled on this repository (plan limitation — same as secret
          # scanning). `upload: never` lets the analysis still run (findings appear
          # in this run's logs) while skipping the upload step that otherwise 403s
          # with "Code scanning is not enabled for this repository", turning every
          # run red. Flip to `upload: always` (or delete this `with:` block) the day
          # GHAS is enabled or the repo goes public. See CHANGELOG 2026-07-07.
          upload: never

