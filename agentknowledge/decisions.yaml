- id: "ADR-009"
  title: "McpTenantPickerAuthenticator short-circuits for non-MCP clients via the mcp-default scope"
  date: "2026-07-01"
  status: "Accepted"
  context: >-
    The browser-mcp-tenant-pick flow may be bound realm-wide as the default browser
    flow (setup guide D.8 Option A), in which case the Authenticator's authenticate()
    also runs for NON-MCP clients — regular yourapp-{env}-web logins and service
    clients. Without a guard, those would all be 302-redirected to YourApp web's
    /mcp/consent, breaking normal login. Spec §5.1 was updated with a step-0
    short-circuit: an MCP client is identified by carrying the mcp-default client
    scope (as a default OR optional scope), tested via
    ClientModel.getClientScopes(true).containsKey("mcp-default") ||
    getClientScopes(false).containsKey(...). Non-MCP clients get context.success()
    (a no-op pass-through for the REQUIRED execution — success(), not attempted(),
    because attempted() would fail a REQUIRED step) and the flow completes as a
    normal login. This makes mcp-default the single on/off switch for the handoff
    and lets the flow be bound realm-wide safely. Constant MCP_CLIENT_SCOPE =
    "mcp-default" and a private isMcpClient(ClientModel) helper encapsulate the
    check. 5 new unit tests (113 unit + 1 IT green).
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticator.java"
    - "specs/keycloak.spi.mcp.md"

- id: "ADR-010"
  title: "Per-client flow binding (Option B) is the recommended MCP binding; the SPI short-circuit is a safety net, not a realm-wide-binding enabler"
  date: "2026-07-03"
  status: "Accepted"
  supersedes_note: "Clarifies and corrects framing in ADR-009."
  context: >-
    ADR-009 introduced the non-MCP short-circuit and described it as letting the
    browser-mcp-tenant-pick flow be "bound realm-wide safely". Real-world testing
    (setup guide D.8, commit 1e67e13) disproved that framing: Option A (realm-wide
    browser-flow binding) took down ALL logins — a malformed MCP flow bound
    realm-wide returns HTTP 400 for every login, including the web client — and it
    also breaks the SPI's MCP-client detection, because realm-default assignment of
    the mcp-default scope gives that scope to every client, so the guard can no
    longer distinguish the web client from a real MCP client. The recommendation is
    therefore REVERSED to Option B (per-client binding): the realm default browser
    flow stays browser-federated-only, YourApp web sets
    authenticationFlowBindingOverrides.browser per DCR'd client, and mcp-default is
    assigned per-client (never realm-default). Under Option B the current SPI guard
    (isMcpClient via mcp-default scope) is correct and functions purely as a safety
    net — no code change is required. SPI design §5.1 carries a DETECTION-SIGNAL
    CAVEAT documenting an escape hatch for anyone forced onto Option A: switch the
    guard to a DCR-time client attribute (client.getAttribute("yourapp.mcp") ==
    "true") that the web client cannot accidentally acquire. That hardening is
    deferred (YAGNI under Option B) and tracked as tech debt. No SPI source change
    was made for this ADR; it corrects documentation only.
  files:
    - "specs/keycloak.spi.mcp.md"
    - "specs/keycloak.web.mcp.md"
    - "specs/keycloak-setup-guide.md"

- id: "ADR-011"
  title: "MCP clients are marked (scopes + flow binding + yourapp.mcp attribute) atomically at registration via a Client Registration Policy, not by the app at first /mcp/consent"
  date: "2026-07-06"
  status: "Accepted"
  builds_on_note: "Implements the atomic-registration bootstrap and activates the yourapp.mcp attribute detection that ADR-010 deferred as tech debt (TD-009)."
  context: >-
    The 2026-07-05 end-to-end interactive test exposed a circular bootstrapping
    dependency (ERRATA-001): a freshly DCR'd MCP client has no mcp-default scope and
    no browser-mcp-tenant-pick binding, so its FIRST authorization cannot be detected
    as MCP and falls through the realm-default browser-federated-only flow — showing
    Keycloak's native consent and never provisioning. The earlier plan bound the flow
    and assigned scopes in the app at /mcp/consent, but reaching /mcp/consent requires
    the SPI in browser-mcp-tenant-pick to run, which requires the client already be
    bound to that flow. Deadlock. Resolution: a new McpClientRegistrationPolicy CRP
    marks the client at REGISTRATION time (afterRegister mutates the live ClientModel
    inside the registration transaction) — atomic, so either fully-marked or rolled
    back; partial states are impossible and no reconciliation logic is needed. This is
    the same framework hook Keycloak's own built-in CRPs use. Decisions: (1) all
    anonymous DCR registrations are treated as MCP (anonymous registration IS the
    signal; there is no reliable in-band discriminator); (2) scope lists + flow alias
    are ComponentModel config properties (admin-tunable) with the settled defaults as
    fallback; (3) the realm default browser flow stays browser-federated-only —
    per-client binding is the only route into the MCP flow, confining any MCP-flow bug
    to MCP clients; (4) the McpTenantPickerAuthenticator §5.1 short-circuit is demoted
    to a pure SAFETY NET (not load-bearing) and its detection now PREFERS the
    yourapp.mcp attribute over mcp-default scope presence — the attribute cannot be
    accidentally acquired by the web client via a realm-default scope. The deferred
    AllowedGrantTypes rejection (register B1) is NOT folded in yet; the CRP's
    beforeRegister is a documented no-op stub reserved for it. TDD: 15 new unit tests
    (marking, default/optional scope assignment, flow binding, atomic rollback on
    missing scope/flow, config override) + 1 real-DCR integration test proving the
    atomic-at-registration client shape against Keycloak 26.6.0; 129 unit + 2 IT green.
    All 26.6.0 model-API signatures verified against the pinned BOM jars before coding.
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicy.java"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicyFactory.java"
    - "src/providers/src/main/resources/META-INF/services/org.keycloak.services.clientregistration.policy.ClientRegistrationPolicyFactory"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticator.java"
    - "specs/ERRATA-001-mcp-registration-crp.md"
    - "specs/keycloak.spi.mcp.md"
    - "specs/keycloak.web.mcp.md"

- id: "ADR-012"
  title: "Picker-result carries the session-correlation claims (kc_client_id/kc_tab_id/auth_session_id) echoed from the picker-request; the callback stays stateless"
  date: "2026-07-06"
  status: "Accepted"
  context: >-
    Production E2E hit HTTP 400 on the final hop: the app posts the picker-result
    to /realms/{realm}/mcp-picker-callback and the SPI logs "client=null not found".
    Root cause (ERRATA-003) is a contract desync, not a resume-mechanics defect:
    McpPickerCallbackResourceProvider recovers the suspended auth session + client
    from three correlation claims carried inside the signed picker-result
    (kc_client_id, kc_tab_id, auth_session_id), but the app spec (web §2.2 step 5 /
    §3.3) defined the picker-result claim set without them, so the app never sent
    them and getClientByClientId(null) returned null. The correlation values already
    exist — the SPI's picker-REQUEST carries them and the app holds the full request
    server-side for the wizard — so the fix is for the app to echo three fields, from
    the SERVER-HELD picker-request (not the client POST body; a client-supplied
    kc_client_id would be a session-fixation surface). Decisions: (1) the three kc_*
    claims are a mandatory part of the picker-result contract; (2) they are carried
    inside the HMAC-signed JWT (tamper-proof) rather than as URL query params —
    rejecting the alternative of re-architecting suspend/resume around
    context.getActionUrl()/session_code, which discards tested code and weakens the
    correlation to URL params; (3) the callback stays stateless (correlation in the
    token, not server state) and resumes via Keycloak's own
    AuthenticationFlowURLHelper.getLastExecutionUrl; (4) the SPI now distinguishes a
    missing correlation claim (new `missing_correlation` code + a spec-pointing WARN)
    from a genuine `client_not_found`. SPI-side + spec fixes applied here; the app-side
    echo is the remaining change that actually clears the 400. Also reconciled the
    stale SPI design §5.3 (it had documented jti-based correlation +
    AuthenticationProcessor.continueAuthentication, neither of which was built).
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/resource/McpPickerCallbackResourceProvider.java"
    - "specs/ERRATA-003-picker-result-correlation-claims.md"
    - "specs/keycloak.spi.mcp.md"
    - "specs/keycloak.web.mcp.md"

- id: "ADR-013"
  title: "The tenant-picker authenticator is a re-entrant suspend/resume step; the callback signals completion via an auth note"
  date: "2026-07-07"
  status: "Accepted"
  context: >-
    Once ERRATA-003 (ADR-012) let mcp-picker-callback resume instead of 400, an
    infinite redirect loop surfaced between /mcp/consent and Keycloak. Root cause:
    Keycloak resumes a CHALLENGED execution by re-invoking the authenticator's
    authenticate(), NOT action(), because the resume rides a redirect to
    getLastExecutionUrl (not a form POST to the action URL). McpTenantPickerAuthenticator
    .authenticate() was not re-entrant — for an MCP client with an authenticated user
    it unconditionally built a fresh picker-request and re-challenged, so every resume
    bounced the browser back to /mcp/consent forever. Decisions: (1) the tenant-picker
    authenticator is a suspend/resume step and MUST be re-entrant — authenticate()
    opens with a resume guard that finishes the step (context.success()) when the
    out-of-band consent is already recorded; (2) the completion signal is an EXPLICIT
    auth-session note (yourapp.mcp.picker.completed = "true") written by the callback,
    not an inference from "is yourapp_tenant_id set?" — the validator's Jackson path
    bypasses the builder's requireString, so a signed-but-malformed null-tenant result
    could otherwise still loop; (3) writer (callback) and reader (authenticator) share
    ONE public constant, McpTenantPickerAuthenticator.AUTH_NOTE_PICKER_COMPLETED, so
    the key cannot drift; (4) NO resume re-architecture — the callback-resource +
    last-execution-URL resume is retained (the getActionUrl/session_code alternative
    stays rejected, per ADR-012); (5) NO app-side change — the loop was evidence the
    ERRATA-003 echo works. General rule: any challenge-based authenticator that
    suspends to external UI must be written re-entrantly.
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticator.java"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/resource/McpPickerCallbackResourceProvider.java"
    - "specs/ERRATA-004-picker-resume-reentrancy.md"
    - "specs/keycloak.spi.mcp.md"

- id: "ADR-014"
  title: "CRP forces default-scope placement (remove-then-add) and suppresses Keycloak's built-in consent for MCP clients"
  date: "2026-07-07"
  status: "Accepted"
  context: >-
    Once ERRATA-004 let the MCP flow complete end-to-end, smoke-mcp.sh exposed two
    McpClientRegistrationPolicy client-shape defects. (1) mcp-default + the author
    bundle were missing from the DCR'd client's DEFAULT client scopes even though
    they were effective (token aud correct). Root cause: Keycloak's OIDC DCR maps the
    registration request's `scope` field to the new client's OPTIONAL client scopes
    BEFORE the CRP's afterRegister runs, and ClientModel.addClientScope is a no-op
    when a binding already exists — so it never promotes an existing optional binding
    to default. yourapp:admin (not in the request scope) was placed correctly, which is
    the tell. (2) Keycloak's built-in OAUTH_GRANT consent screen double-upped the
    yourapp /mcp/consent wizard because the mcp-hardening consent-required client-policy
    executor sets consentRequired=true. Decisions: (1) the CRP makes scope placement
    authoritative via remove-then-add (removeClientScope then addClientScope(scope,
    asDefault)) for every configured scope — both APIs verified present in 26.6.0 via
    javap; (2) the CRP sets consentRequired=false so the yourapp wizard is the sole
    consent surface — chosen over removing the executor from the mcp-hardening profile
    (that would be per-environment admin config, not code that travels with the deploy);
    this is safe because client-policy executors fire on triggerOnEvent (the
    DynamicClientRegistered event) BEFORE the CRP's triggerAfterRegister — verified
    against the 26.6.0 AbstractClientRegistrationProvider bytecode (offset 228 < 237) —
    so the CRP runs last and its setter wins; (3) the integration test now sends a
    `scope` field (it previously sent none, which is why it passed while prod failed),
    clears all default registration policies so the scoped anonymous DCR reaches the
    CRP, and asserts both default-scope placement and consentRequired=false —
    converting the IT into a real regression guard. Both mutations stay inside the
    atomic afterRegister transaction.
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicy.java"
    - "src/providers/src/test/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicyTest.java"
    - "src/providers/src/test/java/io/yourapp/keycloak/mcp/integration/McpClientRegistrationPolicyIT.java"
    - "specs/ERRATA-006-crp-scope-promotion-and-consent.md"
    - "specs/keycloak.spi.mcp.md"

- id: "ADR-015"
  title: "Host the MCP tenant picker in a per-IdP Post Broker Login Flow for fresh/brokered sessions (config-only)"
  date: "2026-07-07"
  status: "Accepted"
  context: >-
    The full MCP chain worked for already-logged-in (Cookie) sessions but failed
    for fresh/cookieless sessions: after a brokered IdP login (Google/Microsoft),
    Keycloak does not run browser-flow executions placed after the IdP-redirect step
    (longstanding behavior, issue #10250), so the tenant picker in browser-mcp-tenant-pick
    is skipped and /mcp/consent is never reached (ERRATA-005). Decision: also host the
    same McpTenantPickerAuthenticator ("YourApp MCP Tenant Picker") in a Post Broker
    Login Flow bound per-IdP — Keycloak's sanctioned hook for running an authenticator
    after brokered login. A 26.6.0 SDK spike (decompiling LoginActionsService,
    AuthenticationProcessor, AuthenticationFlowURLHelper, IdentityBrokerService)
    confirmed the authenticator works UNMODIFIED there: (1) the brokered login keeps a
    single AuthenticationSessionModel keyed by (rootAuthSessionId, client, tabId), so
    authSession.getClient() is the original MCP client, context.getUser() is the
    brokered user, and the ERRATA-004 re-entrancy note (yourapp.mcp.picker.completed)
    lives on that same session so the loop does not reappear on the IdP path; (2) the
    MCP-detection short-circuit is resolvable AND load-bearing there (per-IdP flow
    shared with web logins — it no-ops the picker for non-MCP clients); (3) suspend/
    resume works because AuthenticationFlowURLHelper.getLastExecutionUrl is
    flow-path-agnostic — it rebuilds the resume URL from the current.flow.path auth
    note, which LoginActionsService.brokerLoginFlow sets to "post-broker-login" via
    AuthenticationProcessor.setFlowPath, so the callback's existing getLastExecutionUrl
    redirect resumes the post-broker flow correctly. Consequences: (a) the §5.1
    short-circuit is reclassified from "safety net only" (ADR-011) to LOAD-BEARING in
    the post-broker context; (b) the fix is CONFIGURATION-ONLY — one shared
    post-broker-mcp-tenant-pick flow (single Required picker execution + its own
    yourapp.web.host config) set as the Post login flow on Google + Microsoft; (c) NO
    change to McpTenantPickerAuthenticator logic or McpPickerCallbackResourceProvider,
    and NO app-side change (the picker-request/result contract, correlation claims, and
    the fixed /mcp-picker-callback URL are identical regardless of hosting flow). Code
    touch was documentation-only (comments/help text/marker note the two-flows design).
    Rejected alternative: a RequiredActionProvider that fires on both paths with one
    hook — cleaner in theory but would require changing the callback's resume mechanism
    (required actions resume via a different URL than getLastExecutionUrl), a larger and
    riskier change than reusing the working authenticator in a second flow.
  files:
    - "specs/ERRATA-005-post-broker-tenant-picker.md"
    - "specs/keycloak.spi.mcp.md"
    - "specs/keycloak-setup-guide.md"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticator.java"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticatorFactory.java"

- id: "ADR-016"
  title: "Drop the consent-required executor/CRP for MCP clients; the CRP override does not win; consent is flow-enforced"
  date: "2026-07-08"
  status: "Accepted"
  context: >-
    Corrects the consent portion of ADR-014 (the scope-promotion portion of ADR-014
    still stands). ADR-014 claimed the CRP's client.setConsentRequired(false) in
    afterRegister wins over the mcp-hardening 'consent-required' executor because
    triggerOnEvent fires before triggerAfterRegister. Production verification
    (smoke-mcp.sh, new consentRequired assertion) proved this WRONG: the DCR'd client
    reads consentRequired=true and Keycloak still shows its built-in "Grant Access"
    screen on top of the yourapp /mcp/consent wizard (double consent). Mechanism: the
    consent-required executor's autoConfigure mutates the client REPRESENTATION, which
    is applied to the model AFTER the CRP's afterRegister, re-setting consentRequired
    =true (and the ConsentRequiredClientRegistrationPolicy, if present as an anonymous
    CRP, forces it too). The IT was green only because it strips all registration
    policies, so no consent-forcer runs there. Decision: (1) the authoritative fix is a
    CONFIG change — remove the 'consent-required' executor from the mcp-hardening
    profile AND the 'consent-required' Client Registration Policy if present; (2) the
    CRP's setConsentRequired(false) is retained as belt-and-suspenders (effective once
    the forcers are gone) with an honest comment; (3) dropping Keycloak's consent does
    NOT weaken enforcement — the tenant picker + /mcp/consent wizard are gated by the
    authentication flow (the picker is REQUIRED and suspends; no token issues until the
    app returns a valid HMAC-signed, jti-single-use, correlation-bound picker-result),
    which is stronger and non-redundant with Keycloak's generic consent; (4) the one
    control that actually prevents a consent bypass is grant-type restriction — an MCP
    client must NOT allow Direct Access Grants (ROPC), which would skip the browser flow
    entirely; smoke-mcp.sh now asserts directAccessGrantsEnabled=false, and the deferred
    B1 (AllowedGrantTypes CRP, SPI design 5.8 beforeRegister stub) should enforce it
    atomically at registration. Docs corrected: ERRATA-006, setup guide D.5/D.6,
    keycloak.prd.md System-1/System-2 tables.
  files:
    - "specs/ERRATA-006-crp-scope-promotion-and-consent.md"
    - "specs/keycloak-setup-guide.md"
    - "specs/keycloak.prd.md"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicy.java"
    - "smoke-mcp.sh"

- id: "ADR-017"
  title: "B1 AllowedGrantTypes: reject non-authorization-code grants at DCR registration, folded into the MCP CRP"
  date: "2026-07-08"
  status: "Accepted"
  context: >-
    Once Keycloak's built-in consent screen is dropped for MCP clients (ADR-016),
    the tenant picker + /mcp/consent are enforced purely by the browser authentication
    flow. The one way to bypass that enforcement is a grant type that does not use the
    browser flow — above all Direct Access Grants (password / ROPC), which issues
    tokens with no picker and no wizard. Standard Keycloak client-policy executors
    constrain authorize/response-type behaviour but do NOT reject a DCR registration
    for its requested grant_types (a DCR requesting password returns 201). Decision:
    implement B1 as the atomic fail-at-registration guard, folded into
    McpClientRegistrationPolicy.beforeRegister (and beforeUpdate) per the one-provider
    note in spec 5.8 — not a separate provider. It rejects, with a 400, any proposed
    client enabling directAccessGrants (ROPC), implicit, serviceAccounts
    (client_credentials), the device authorization grant, or CIBA, by reading the
    ClientRepresentation flow flags (isDirectAccessGrantsEnabled/isImplicitFlowEnabled/
    isServiceAccountsEnabled) and the device/CIBA grant attributes
    (oauth2.device.authorization.grant.enabled, oidc.ciba.grant.enabled). It is a
    SECURITY INVARIANT, deliberately NOT admin-tunable (a loosenable denylist is a
    footgun), and runs on update too so a client cannot widen its grants after
    registration. This is defense-in-depth over the disabled realm Direct Grant flow
    (setup guide D.10) and adds fail-at-registration ergonomics + broader coverage
    (implicit/client_credentials/device/CIBA). API verified via javap against 26.6.4
    (ClientRegistrationContext.getClient -> ClientRepresentation; the flow-flag getters
    and getAttributes). TDD: 7 unit tests (each disallowed grant rejected on register;
    beforeUpdate rejects too; auth-code-only passes; null client is safe) + 1 real-DCR
    testcontainers IT (a password-grant DCR is rejected with 4xx). 142 unit + 3 IT green.
    smoke-mcp.sh also asserts the live client shape (directAccessGrantsEnabled=false).
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicy.java"
    - "src/providers/src/test/java/io/yourapp/keycloak/mcp/clientreg/McpClientRegistrationPolicyTest.java"
    - "src/providers/src/test/java/io/yourapp/keycloak/mcp/integration/McpClientRegistrationPolicyIT.java"
    - "specs/keycloak.spi.mcp.md"

- id: "ADR-018"
  title: "MCP handoff defense-in-depth: request-bound results, scope subset validation, host allowlist, replay invariant (RT-008/009/010/011)"
  date: "2026-07-09"
  status: "Accepted"
  context: >-
    Red-team review (specs/security-red-team-report-2026-07-04.md) flagged that the
    SPI trusts YourApp web (the /mcp/consent app) to echo/constrain everything, with
    only HMAC signature + jti replay + user_sub_echo + kc_* correlation as binding.
    Hardened four things, defense-in-depth against a compromised or buggy consent app
    (a large TCB before public MCP): (RT-008) McpTenantPickerAuthenticator stores the
    picker-request jti in auth-session note yourapp.mcp.picker.request.jti at suspend;
    McpPickerCallbackResourceProvider requires token.picker_request_jti to equal it AND
    token.oauth_state to equal the auth session's STATE_PARAM client note, so a signed
    result for a DIFFERENT request cannot be accepted for this session; chosen_tenant_id
    is format-validated ([A-Za-z0-9._-], <=128) before writing to the token path.
    (RT-009) granted_scopes are subset-validated against the client's assigned client
    scopes (getClientScopes(true|false).keySet()) and rejected on unknown/blank/duplicate
    scopes, so a consent-service bug cannot mint arbitrary/elevated token scopes.
    (RT-011) resolveWebHost strictly validates yourapp.web.host as a bare hostname (LDH
    labels only; no scheme/port/path/userinfo/whitespace) and enforces an in-code
    per-realm allowlist for internet-facing realms (yourapp-prod->prod.yourapp.com,
    yourapp-dev->dev.yourapp.com), failing closed; unlisted realms (test/local) require
    valid syntax only. Pinned in code, not admin-tunable, because the threat is admin
    misconfig/compromise redirecting handoff tokens. (RT-010) ReplayCache logs a
    single startup WARN that it is in-memory single-instance and Cloud Run maxScale=1
    is a security invariant until the replay store is externalized. New rejection error
    codes on the callback: request_mismatch, state_mismatch, invalid_tenant,
    invalid_scopes. TDD: 5 new callback unit tests + 5 new authenticator unit tests;
    152 unit + 3 IT green. No app-side change (the app already echoes these claims; the
    SPI now enforces them independently).
  files:
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/resource/McpPickerCallbackResourceProvider.java"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/authenticator/McpTenantPickerAuthenticator.java"
    - "src/providers/src/main/java/io/yourapp/keycloak/mcp/util/ReplayCache.java"
    - "specs/security-red-team-report-2026-07-04.md"
